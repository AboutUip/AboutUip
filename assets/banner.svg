  <text x="102" y="71.5" font-family="'Segoe UI',Inter,sans-serif" font-size="10.5" font-weight="600" letter-spacing="1.2" fill="#FF8FB5">OPEN SOURCE · SINCE 2025.11</text>

  <text x="72" y="178" font-family="'Noto Serif SC','Songti SC','STSong',serif" font-size="82" font-weight="700" fill="url(#name)">小萱<tspan font-family="'Segoe UI',Inter,sans-serif" font-size="72" font-weight="600" fill="#F4F4F8">baibai</tspan></text>

