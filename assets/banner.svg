  <text x="74" y="268" font-family="'Segoe UI',Inter,sans-serif" font-size="16.5" fill="#B4B5C8">从虚拟内核到智能生命体 <tspan fill="#6B6D80">·</tspan> <tspan fill="#FF8FB5" font-weight="600">@AboutUip</tspan> <tspan fill="#6B6D80">·</tspan> 喜欢草莓.</text>

