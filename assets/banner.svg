    <radialGradient id="glowPurple" cx="0" cy="0" r="1" gradientTransform="translate(980 240) rotate(-20) scale(460 300)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A78BFA" stop-opacity="0.18"/>
